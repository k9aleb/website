<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>@k9aleb</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="bg-grid" aria-hidden="true"></div>
    <main class="stage">
      <header class="hud">
        <p class="case-label">Mystery Cases</p>
        <p class="hint" id="status">Click to roll</p>
      </header>

      <section class="opener" id="opener" aria-label="Case opening reel">
        <div class="marker" aria-hidden="true">
          <span class="marker-arrow top"></span>
          <span class="marker-line"></span>
          <span class="marker-arrow bottom"></span>
        </div>
        <div class="viewport" id="viewport">
          <div class="reel" id="reel"></div>
        </div>
      </section>
    </main>

    <div class="reveal" id="reveal" hidden>
      <div class="burst" id="burst" aria-hidden="true"></div>
      <div class="reveal-crate" id="reveal-crate">
        <div class="big-crate">
          <div class="big-lid"></div>
          <div class="big-body">
            <span class="big-latch"></span>
            <span class="big-label">Legendary</span>
          </div>
        </div>
      </div>
      <figure class="prize-frame" id="prize-frame">
        <img id="prize-image" alt="Unboxed prize" />
        <figcaption id="prize-caption">@k9aleb</figcaption>
      </figure>
    </div>
    <script src="case.js"></script>
  </body>
</html>
